     <!-- App favicon -->

</head>

<body>

     <!-- START Wrapper -->
     <div class="wrapper">

          <!-- ========== Topbar Start ========== -->

                              <div class="topbar-item">
                                   <button type="button" class="button-toggle-menu me-2">
                                        <iconify-icon icon="solar:hamburger-menu-broken"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>

                              <!-- Menu Toggle Button -->
                              <div class="topbar-item">
                                   <h4 class="fw-bold topbar-button pe-none text-uppercase mb-0">Welcome to&nbsp;<span
                                             id="shopName"></span>&nbsp;!</h4>
                              </div>
                         </div>

                         <div class="d-flex align-items-center gap-1">

                              <!-- Theme Color (Light/Dark) -->

                                   <button type="button" class="topbar-button" id="light-dark-mode">
                                        <iconify-icon icon="solar:moon-bold-duotone"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>


                              <!-- Theme Setting -->
                              <div class="topbar-item d-none d-md-flex">

                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>
                         </div>
                    </div>
               </div>
          </header>

          <!-- Right Sidebar (Theme Settings) -->

                         <h5 class="text-white m-0">Theme Settings</h5>
                         <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas"
                              aria-label="Close"></button>
                    </div>

                    <div class="offcanvas-body p-0">
                         <div data-simplebar class="h-100">
                              <div class="p-3 settings-bar">

                                   <div>
                                        <h5 class="mb-3 font-16 fw-semibold">Color Scheme</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-bs-theme"
                                                  id="layout-color-light" value="light">
                                             <label class="form-check-label" for="layout-color-light">Light</label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-bs-theme"
                                                  id="layout-color-dark" value="dark">
                                             <label class="form-check-label" for="layout-color-dark">Dark</label>
                                        </div>
                                   </div>

                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Topbar Color</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-topbar-color"
                                                  id="topbar-color-light" value="light">
                                             <label class="form-check-label" for="topbar-color-light">Light</label>
                                        </div>
                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-topbar-color"
                                                  id="topbar-color-dark" value="dark">
                                             <label class="form-check-label" for="topbar-color-dark">Dark</label>
                                        </div>
                                   </div>


                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Menu Color</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-color"
                                                  id="leftbar-color-light" value="light">
                                             <label class="form-check-label" for="leftbar-color-light">
                                                  Light
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-color"
                                                  id="leftbar-color-dark" value="dark">
                                             <label class="form-check-label" for="leftbar-color-dark">
                                                  Dark
                                             </label>
                                        </div>
                                   </div>

                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Sidebar Size</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-default" value="default">
                                             <label class="form-check-label" for="leftbar-size-default">
                                                  Default
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small" value="condensed">
                                             <label class="form-check-label" for="leftbar-size-small">
                                                  Condensed
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-hidden" value="hidden">
                                             <label class="form-check-label" for="leftbar-hidden">
                                                  Hidden
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small-hover-active" value="sm-hover-active">
                                             <label class="form-check-label" for="leftbar-size-small-hover-active">
                                                  Small Hover Active
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small-hover" value="sm-hover">
                                             <label class="form-check-label" for="leftbar-size-small-hover">
                                                  Small Hover
                                             </label>
                                        </div>
                                   </div>

                              </div>
                         </div>
                    </div>
                    <div class="offcanvas-footer border-top p-3 text-center">
                         <div class="row">
                              <div class="col">
                                   <button type="button" class="btn btn-danger w-100" id="reset-layout">Reset</button>
                              </div>
                         </div>
                    </div>
               </div>
          </div>
          <!-- ========== Topbar End ========== -->

          <!-- ========== App Menu Start ========== -->
          <div class="main-nav">
               <!-- Sidebar Logo -->
               <div class="logo-box">
                    <a href="index.html" class="logo-dark">
                         <span class="menu-title" style="color:black;font-size:large;">IMS</span>
                    </a>

                    <a href="index.html" class="logo-light">
                         <span class="menu-title" style="color:white;font-size:large;">IMS</span>
                    </a>
               </div>

               <!-- Menu Toggle Button (sm-hover) -->
               <button type="button" class="button-sm-hover" aria-label="Show Full Sidebar">
                    <iconify-icon icon="solar:double-alt-arrow-right-bold-duotone"
                         class="button-sm-hover-icon"></iconify-icon>
               </button>

               <div class="scrollbar" data-simplebar>
                    <ul class="navbar-nav menu-container" id="navbar-nav">
                    </ul>
               </div>
          </div>
          <!-- ========== App Menu End ========== -->

          <!-- ==================================================== -->
          <!-- Start right Content here -->
          <!-- ==================================================== -->
          <div class="page-content">

               <!-- Start Container Fluid -->
               <div class="container-fluid">
                    <button class="btn btn-primary mb-2" type="button" data-bs-toggle="collapse"
                         data-bs-target="#stockInfoContainer" aria-expanded="false" aria-controls="stockInfoContainer">
                         Show Stock Details
                    </button>
                    <a href="#" id="download-csv" class="btn btn-light btn-sm" title="Download CSV">
                         <iconify-icon icon="mdi:download" class="align-middle"></iconify-icon>
                    </a>
                    <button class="btn btn-primary mb-2" id="reArrangeItemBtn" type="button"
                         onclick="openSkuSortModal()">
                         Re Arrange Order
                    </button>
                    <a href="#" id="download-stock" class="btn btn-light btn-sm" title="Download Stock Report">
                         <iconify-icon icon="mdi:warehouse" class="align-middle"></iconify-icon>
                    </a>
                    <div class="collapse" id="stockInfoContainer">
                         <div class="row">
                              <div class="col-md-6 col-xl-3">
                                   <div class="card border-primary border">
                                        <div class="card-body">
                                             <h5 class="card-title text-primary mb-2">Stock Price</h5>
                                             <p class="card-text">
                                             <h3 class="mt-3 mb-0 text-center" id="total-stock-price"></h3>
                                             </p>

                                        </div>
                                   </div> <!-- end card-body-->
                              </div>

                              <div class="col-md-6 col-xl-3">
                                   <div class="card border-success border">
                                        <div class="card-body">
                                             <h5 class="card-title mb-2 text-success">Stocks in UNIT</h5>
                                             <p class="card-text">
                                             <h3 class="mt-3 mb-0 text-center" id="total-stock-units"></h3>
                                             </p>
                                             <a href="javascript: void(0);" class="btn btn-success btn-sm"
                                                  data-bs-toggle="modal" data-bs-target="#unitModal">Units by
                                                  Category</a>
                                        </div>
                                   </div> <!-- end card-body-->
                              </div>
                         </div>
                    </div>
                    <div class="row">
                         <div class="col-xl-12">
                              <div class="card">
                                   <div>
                                        <div class="table-responsive" id="product-table">

                                        </div>
                                        <!-- end table-responsive -->
                                   </div>
                              </div>
                         </div>

                    </div>

               </div>

               <!-- update Modal -->
               <div class="modal fade" id="updateItemModal" tabindex="-1" aria-labelledby="updateItemeModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                         <div class="modal-content">
                              <div class="modal-header">
                                   <h5 class="modal-title" id="updateItemModalLabel">Update Product</h5>
                                   <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                              </div>
                              <div class="modal-body">
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label">Type</label>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="form-check form-check-inline">
                                                  <input class="form-check-input" type="radio" name="updateType"
                                                       id="inlineRadio1" value="Liquor">
                                                  <label class="form-check-label" for="inlineRadio1">Liquor</label>
                                             </div>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="form-check form-check-inline">
                                                  <input class="form-check-input" type="radio" name="updateType"
                                                       id="inlineRadio2" value="Wine">
                                                  <label class="form-check-label" for="inlineRadio2">Wine</label>
                                             </div>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="form-check form-check-inline">
                                                  <input class="form-check-input" type="radio" name="updateType"
                                                       id="inlineRadio3" value="Beer">
                                                  <label class="form-check-label" for="inlineRadio3">Beer</label>
                                             </div>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="form-check form-check-inline">
                                                  <input class="form-check-input" type="radio" name="updateType"
                                                       id="inlineRadio4" value="COOLDRINKS">
                                                  <label class="form-check-label" for="inlineRadio3">COOLDRINKS</label>
                                             </div>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="form-check form-check-inline">
                                                  <input class="form-check-input" type="radio" name="updateType"
                                                       id="inlineRadio4" value="CIGERATTE">
                                                  <label class="form-check-label" for="inlineRadio3">CIGERATTE</label>
                                             </div>
                                        </div>
                                   </div>
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <form>
                                                  <label for="product-price" class="form-label">
                                                       <h4></h4>
                                                  </label>
                                             </form>
                                        </div>
                                   </div>
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label">Brand</label>
                                        </div>
                                        <div class="col-lg-3">
                                             <div class="col-lg-3">
                                                  <div class="dropdown">
                                                       <button type="button" class="btn btn-primary dropdown-toggle"
                                                            id="brandDropdown-updateItem" data-bs-toggle="dropdown"
                                                            aria-haspopup="true" aria-expanded="false">
                                                            Select Brand
                                                       </button>
                                                       <ul class="dropdown-menu" id="brand-update">
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="BEER">BEER</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="RUM">RUM</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="WINE">WINE</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="VODKA">VODKA</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="BRANDY">BRANDY</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="WHISKY">WHISKY</a></li>
                                                            <li><a class="dropdown-item" href="#"
                                                                      data-brand="SCOTCH">SCOTCH</a></li>
                                                       </ul>
                                                  </div>
                                             </div>
                                        </div>
                                   </div>
                                   <hr />
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label">Item</label>
                                        </div>
                                        <div class="col-lg-6">
                                             <input type="text" id="sellerSKU-update" class="form-control">
                                        </div>
                                   </div>
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label">Bar Code</label>
                                        </div>
                                        <div class="col-lg-6">
                                             <input type="text" id="upc-update" class="form-control">
                                        </div>
                                   </div>
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label"></label>
                                        </div>
                                   </div>
                                   <div class="row">
                                        <div class="col-lg-3">
                                             <label for="simpleinput" class="form-label">Stock</label>
                                        </div>
                                        <div class="col-lg-3">
                                             <input type="text" id="stock-update" class="form-control">
                                        </div>
                                   </div>
                                   <div class="mb-3">
                                        <label for="simpleinput" class="form-label">Purchase Price</label>
                                        <div class="input-group mb-3">
                                             <span class="input-group-text fs-20"><i class="bx bx-dollar"></i></span>
                                             <input type="number" id="purchasePrice-update" class="form-control"
                                                  placeholder="000">
                                        </div>
                                   </div>
                                   <div class="mb-3">
                                        <label for="simpleinput" class="form-label">Sale Price</label>
                                        <div class="input-group mb-3">
                                             <span class="input-group-text fs-20"><i class="bx bx-dollar"></i></span>
                                             <input type="number" id="salePrice-update" class="form-control"
                                                  placeholder="000">
                                        </div>
                                   </div>
                                   <div class="mb-3">
                                        <label for="simpleinput" class="form-label">Profit Amount</label>
                                        <div class="input-group mb-3">
                                             <span class="input-group-text fs-20"><i class="bx bxs-discount"></i></span>
                                             <input type="number" id="profitAmount-update" class="form-control"
                                                  placeholder="000" disabled>
                                        </div>
                                   </div>
                              </div>
                              <div class="modal-footer">
                                   <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                   <button type="button" id="updateButton" class="btn btn-primary"
                                        onclick="updateProduct()">Update Product</button>
                              </div>
                         </div>
                    </div>
               </div>


               <!-- delete Modal -->
               <div class="modal fade" id="deleteItemModal" tabindex="-1" aria-labelledby="deleteItemeModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                         <div class="modal-content">
                              <div class="modal-header">
                                   <h5 class="modal-title" id="deleteItemModalLabel">Delete Product</h5>
                                   <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                              </div>
                              <div class="modal-body">
                                   <div class="mb-3">
                                        <label for="simpleinput" class="form-label">Are you sure you want to delet the
                                             Item?</label>
                                        <label for="simpleinput" class="form-label" id="deleteSKU"
                                             style="display: none;"></label>
                                   </div>
                              </div>
                              <div class="modal-footer">
                                   <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                   <button type="button" id="deleteButton" class="btn btn-primary"
                                        onclick="deleteProduct()">Delete</button>
                              </div>
                         </div>
                    </div>
               </div>

               <!-- Unit by category Modal -->
               <div class="modal fade" id="unitModal" tabindex="-1" aria-labelledby="unitModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                         <div class="modal-content">
                              <div class="modal-header">
                                   <h5 class="modal-title" id="unitModalLabel">Units By Category</h5>
                                   <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                              </div>
                              <div class="modal-body">
                                   <div class="mb-3" id="total-stock-units-category">

                                   </div>
                              </div>
                              <div class="modal-footer">
                                   <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                              </div>
                         </div>
                    </div>
               </div>

               <div class="modal fade" id="skuSortModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                         <div class="modal-content">

                              <div class="modal-header">
                                   <h5 class="modal-title">Re Arrange Order</h5>
                                   <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                              </div>

                              <div class="modal-body">
                                   <table class="table table-bordered table-hover" id="skuSortTable">
                                        <thead>
                                             <tr>
                                                  <th style="width:100px">Order</th>
                                                  <th>SKU</th>
                                             </tr>
                                        </thead>
                                        <tbody id="sortableRows">
                                             <!-- Rows will be appended dynamically -->
                                        </tbody>
                                   </table>
                              </div>
                              <div class="modal-footer">
                                   <button type="button" id="saveSkuOrder" class="btn btn-primary">Save</button>
                              </div>

                         </div>
                    </div>
               </div>

          </div>

          <!-- ==================================================== -->
          <!-- End Page Content -->
          <!-- ==================================================== -->

     </div>


     <!-- END Wrapper -->

     <!-- Vendor Javascript (Require in all Page) -->
     <script src="assets/js/vendor.js"></script>

     <!-- App Javascript (Require in all Page) -->
     <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js"></script>
     <script src="assets/js/products.js"></script>
     <script src="assets/js/table-gridjs.js"></script>
     <script src="assets/js/gridjs.umd.js"></script>
     <script>
          restrictMenu();
     </script>

     <script>
          document.addEventListener("DOMContentLoaded", function () {
               const stockInfoContainer = document.getElementById("stockInfoContainer");
               stockInfoContainer.addEventListener("shown.bs.collapse", function () {
                    loadTotalCount();
               });
          });
     </script>
</body>
