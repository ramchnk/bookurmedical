<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Intent</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="A fully responsive premium admin dashboard template" />
     <meta name="author" content="Techzaa" />
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />

     <!-- App favicon -->
     <link rel="shortcut icon" href="assets/images/favicon.ico">

     <!-- Vendor css (Require in all Page) -->
     <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />

     <!-- Icons css (Require in all Page) -->
     <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

     <!-- App css (Require in all Page) -->
     <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />
     <link href="assets/css/mermaid.min.css" rel="stylesheet" type="text/css" />
     <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
</head>

<body>

     <!-- START Wrapper -->
     <div class="wrapper">

          <!-- ========== Topbar Start ========== -->
          <header class="topbar">
               <div class="container-fluid">
                    <div class="navbar-header">
                         <div class="d-flex align-items-center">
                              <!-- Menu Toggle Button -->
                              <div class="topbar-item">
                                   <button type="button" class="button-toggle-menu me-2">
                                        <iconify-icon icon="solar:hamburger-menu-broken"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>

                              <!-- Menu Toggle Button -->
                              <div class="topbar-item">
                                   <h4 class="fw-bold topbar-button pe-none text-uppercase mb-0">Welcome to&nbsp;<span
                                             id="shopName"></span>&nbsp;!</h4>
                              </div>
                         </div>

                         <div class="d-flex align-items-center gap-1">

                              <!-- Theme Color (Light/Dark) -->
                              <div class="topbar-item">
                                   <button type="button" class="topbar-button" id="light-dark-mode">
                                        <iconify-icon icon="solar:moon-bold-duotone"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>


                              <!-- Theme Setting -->
                              <div class="topbar-item d-none d-md-flex">
                                   <button type="button" class="topbar-button" id="theme-settings-btn"
                                        data-bs-toggle="offcanvas" data-bs-target="#theme-settings-offcanvas"
                                        aria-controls="theme-settings-offcanvas">
                                        <iconify-icon icon="solar:settings-bold-duotone"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>
                         </div>
                    </div>
               </div>
          </header>

          <!-- Right Sidebar (Theme Settings) -->
          <div>
               <div class="offcanvas offcanvas-end border-0" tabindex="-1" id="theme-settings-offcanvas">
                    <div class="d-flex align-items-center bg-primary p-3 offcanvas-header">
                         <h5 class="text-white m-0">Theme Settings</h5>
                         <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas"
                              aria-label="Close"></button>
                    </div>

                    <div class="offcanvas-body p-0">
                         <div data-simplebar class="h-100">
                              <div class="p-3 settings-bar">

                                   <div>
                                        <h5 class="mb-3 font-16 fw-semibold">Color Scheme</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-bs-theme"
                                                  id="layout-color-light" value="light">
                                             <label class="form-check-label" for="layout-color-light">Light</label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-bs-theme"
                                                  id="layout-color-dark" value="dark">
                                             <label class="form-check-label" for="layout-color-dark">Dark</label>
                                        </div>
                                   </div>

                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Topbar Color</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-topbar-color"
                                                  id="topbar-color-light" value="light">
                                             <label class="form-check-label" for="topbar-color-light">Light</label>
                                        </div>
                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-topbar-color"
                                                  id="topbar-color-dark" value="dark">
                                             <label class="form-check-label" for="topbar-color-dark">Dark</label>
                                        </div>
                                   </div>


                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Menu Color</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-color"
                                                  id="leftbar-color-light" value="light">
                                             <label class="form-check-label" for="leftbar-color-light">
                                                  Light
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-color"
                                                  id="leftbar-color-dark" value="dark">
                                             <label class="form-check-label" for="leftbar-color-dark">
                                                  Dark
                                             </label>
                                        </div>
                                   </div>

                                   <div>
                                        <h5 class="my-3 font-16 fw-semibold">Sidebar Size</h5>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-default" value="default">
                                             <label class="form-check-label" for="leftbar-size-default">
                                                  Default
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small" value="condensed">
                                             <label class="form-check-label" for="leftbar-size-small">
                                                  Condensed
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-hidden" value="hidden">
                                             <label class="form-check-label" for="leftbar-hidden">
                                                  Hidden
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small-hover-active" value="sm-hover-active">
                                             <label class="form-check-label" for="leftbar-size-small-hover-active">
                                                  Small Hover Active
                                             </label>
                                        </div>

                                        <div class="form-check mb-2">
                                             <input class="form-check-input" type="radio" name="data-menu-size"
                                                  id="leftbar-size-small-hover" value="sm-hover">
                                             <label class="form-check-label" for="leftbar-size-small-hover">
                                                  Small Hover
                                             </label>
                                        </div>
                                   </div>

                              </div>
                         </div>
                    </div>
                    <div class="offcanvas-footer border-top p-3 text-center">
                         <div class="row">
                              <div class="col">
                                   <button type="button" class="btn btn-danger w-100" id="reset-layout">Reset</button>
                              </div>
                         </div>
                    </div>
               </div>
          </div>
          <!-- ========== Topbar End ========== -->

          <!-- ========== App Menu Start ========== -->
          <div class="main-nav">
               <!-- Sidebar Logo -->
               <div class="logo-box">
                    <a href="index.html" class="logo-dark">
                         <span class="menu-title" style="color:black;font-size:large;">IMS</span>
                    </a>

                    <a href="index.html" class="logo-light">
                         <span class="menu-title" style="color:white;font-size:large;">IMS</span>
                    </a>
               </div>

               <!-- Menu Toggle Button (sm-hover) -->
               <button type="button" class="button-sm-hover" aria-label="Show Full Sidebar">
                    <iconify-icon icon="solar:double-alt-arrow-right-bold-duotone"
                         class="button-sm-hover-icon"></iconify-icon>
               </button>

               <div class="scrollbar" data-simplebar>
                    <ul class="navbar-nav menu-container" id="navbar-nav">
                    </ul>
               </div>
          </div>
          <!-- ========== App Menu End ========== -->

          <!-- ==================================================== -->
          <!-- Start right Content here -->
          <!-- ==================================================== -->
          <div class="page-content">

               <!-- Start Container Fluid -->
               <div class="container-fluid">
                    <div id="indent-alert-container"></div>
                    <div class="row">
                         <div class="col-xl-12">
                              <div class="card">

                                   <div class="card-header d-flex justify-content-between align-items-center gap-1">
                                        <h4 class="card-title flex-grow-1">Sales Counter</h4>
                                        <a href="#" class="btn btn-sm btn-primary" onclick="loadNewPurchase()"
                                             data-bs-toggle="modal" data-bs-target="#purchaseModal">
                                             New Indent
                                        </a>
                                        <a href="#" class="btn btn-sm btn-primary"  data-bs-toggle="modal"
                                             data-bs-target="#downloadIndentReport">
                                             Download Report
                                        </a>
                                   </div>

                                   <div class="card-body p-0">
                                        <div class="table-responsive">
                                             <table id="purchase-table" class="display" style="width:100%">
                                                  <thead>
                                                       <tr>
                                                            <th>SKU</th>
                                                            <th>Opening</th>
                                                            <th>Indent</th>
                                                            <th>Total</th>
                                                            <th>Action</th>
                                                       </tr>
                                                  </thead>
                                                  <tbody>
                                                       <!-- Rows will be dynamically added here -->
                                                  </tbody>
                                             </table>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <!-- end table-responsive -->

                    <div class="modal fade" id="purchaseModal" tabindex="-1" aria-labelledby="purchaseModal"
                         aria-hidden="true">
                         <div class="modal-dialog modal-fullscreen">
                              <div class="modal-content">
                                   <div class="modal-header">
                                        <h5 class="modal-title" id="exampleModalLabel">Internal Transfers</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                             aria-label="Close"></button>
                                   </div>
                                   <div class="modal-body" id="">
                                        <ul class="nav nav-tabs nav-justified">
                                             <li class="nav-item">
                                                  <a href="#itemDetails" data-bs-toggle="tab" aria-expanded="true"
                                                       class="nav-link  active">
                                                       <span class="d-block d-sm-none"><i class="bx bx-home"></i></span>
                                                       <span class="d-none d-sm-block">Items</span>
                                                  </a>
                                             </li>
                                        </ul>
                                        <div class="tab-content pt-2 text-muted">
                                             <div class="tab-pane  show active" id="itemDetails">
                                                  <div class="row">
                                                       <div class="col-lg-4">
                                                            <form>
                                                                 <div class="mb-3">
                                                                      <label for="category-title"
                                                                           class="form-label">Item</label>
                                                                      <input type="text" class="form-control"
                                                                           id="searchInput" placeholder="Search..."
                                                                           data-bs-toggle="dropdown"
                                                                           aria-expanded="false">
                                                                      <ul class="dropdown-menu w-100"
                                                                           id="dropdownContent">

                                                                      </ul>
                                                                 </div>
                                                            </form>
                                                       </div>
                                                       <div class="col-lg-2">
                                                            <form>
                                                                 <div class="mb-2">
                                                                      <label for="category-title"
                                                                           class="form-label">Available</label>
                                                                      <p class="mb-0" id="store-room-available">0</p>
                                                                 </div>
                                                            </form>
                                                       </div>
                                                       <div class="col-lg-2">
                                                            <form>
                                                                 <div class="mb-2">
                                                                      <label for="category-title"
                                                                           class="form-label">Indent</label>
                                                                      <input type="text" id="purchase-qty"
                                                                           class="form-control" placeholder="Quantity"
                                                                           value="">
                                                                 </div>
                                                            </form>
                                                       </div>

                                                       <div class="col-lg-1">
                                                            <form>
                                                                 <div class="mb-1">
                                                                      <label for="category-title"
                                                                           class="form-label">-</label>
                                                                      <button type="button" id="addpurchaseListtable"
                                                                           class="form-control btn btn-primary">+</button>
                                                                 </div>
                                                            </form>
                                                       </div>
                                                  </div>
                                                  <div>
                                                       <table id="purchase-details-table" class="table table-bordered"
                                                            style="width:100%">
                                                            <thead>
                                                                 <tr>
                                                                      <th>Item</th>
                                                                      <th>Opening Stock</th>
                                                                      <th>To BAR Counter</th>
                                                                      <th>Stock</th>
                                                                      <th>Action</th>
                                                                 </tr>
                                                            </thead>
                                                            <tbody>
                                                                 <!-- Dynamic rows will be added here -->
                                                            </tbody>
                                                       </table>
                                                  </div>
                                             </div>
                                        </div>

                                   </div>
                                   <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                             data-bs-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-primary"
                                             id="saveTransfersDetails">Save</button>
                                   </div>
                              </div>
                         </div>
                    </div>


                    <!-- Purchase items Modal -->
                    <div class="modal fade" id="purchaseItems" tabindex="-1" aria-labelledby="purchaseItems"
                         aria-hidden="true">
                         <div class="modal-dialog">
                              <div class="modal-content">
                                   <div class="modal-header">
                                        <h5 class="modal-title" id="memberSaleslLabel">Items Details</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                             aria-label="Close"></button>
                                   </div>
                                   <div class="modal-body" id="">
                                        <div class="tab-content pt-2 text-muted">
                                             <div class="tab-pane  show active" id="membersalesDetails">
                                                  <table id="purchase-items-details-table"></table>
                                             </div>
                                        </div>
                                   </div>
                                   <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                             data-bs-dismiss="modal">Close</button>
                                   </div>
                              </div>
                         </div>
                    </div>


                    <div class="modal fade" id="downloadIndentReport" tabindex="-1" aria-labelledby="downloadIndentReportLabel"
                         aria-hidden="true">
                         <div class="modal-dialog">
                              <div class="modal-content">
                                   <div class="modal-header">
                                        <h5 class="modal-title" id="downloadIndentReportLabel">Download</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                   </div>
                                   <div class="modal-body">
                                        <div class="row">
                                             <div class="col-lg-6">
                                                  <div class="mb-3">
                                                       <label for="product-name" class="form-label">Date</label>
                                                       <input type="text" id="indent-report-sale-date" class="form-control"
                                                            placeholder="Select Date">
                                                  </div>
                                             </div>
                    
                                             <!-- <div class="col-lg-6">
                                                                      <div class="mb-3">
                                                                           <label for="product-name" class="form-label">From Date</label>
                                                                           <input type="text" id="indent-report-from-date" class="form-control" placeholder="Select Date">
                                                                      </div>
                                                                 </div>
                                                       
                                                                 <div class="col-lg-6">
                                                                      <div class="mb-3 ml-5">
                                                                           <label for="product-name" class="form-label">To Date</label>
                                                                           <input type="text" id="indent-report-to-date" class="form-control" placeholder="Select Date">
                                                                      </div>
                                                                 </div> -->
                    
                                        </div>
                                        <div class="modal-footer">
                                             <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                             <button type="button" id="downloadReportBtn" class="btn btn-primary"
                                                  onclick="downloadReport()">Download</button>
                                        </div>
                                   </div>
                    
                              </div>
                         </div>
                    </div>



                    <!-- Edit items Modal -->
                    <div class="modal fade" id="updateItemModal" tabindex="-1" aria-labelledby="updateItemModalLabel"
                         aria-hidden="true">
                         <div class="modal-dialog">
                              <div class="modal-content">
                                   <div class="modal-header">
                                        <h5 class="modal-title" id="updateItemModalLabel">Update Product</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                             aria-label="Close"></button>
                                   </div>
                                   <div class="modal-body">
                                        <div class="row">
                                             <div class="col-lg-3">
                                                  <form>
                                                       <label for="product-price" class="form-label">
                                                            <h4></h4>
                                                       </label>
                                                  </form>
                                             </div>
                                        </div>
                                        <div class="row">
                                             <div class="col-lg-3">
                                                  <label for="simpleinput" class="form-label">Item</label>
                                             </div>
                                             <div class="col-lg-6">
                                                  <input type="text" id="sellerSKU-update" class="form-control"
                                                       readonly>
                                             </div>
                                        </div>
                                        <div class="row">
                                             <div class="col-lg-3">
                                                  <label for="simpleinput" class="form-label"></label>
                                             </div>
                                        </div>
                                        <div class="row">
                                             <div class="col-lg-3">
                                                  <label for="simpleinput" class="form-label">Stock</label>
                                             </div>
                                             <div class="col-lg-3">
                                                  <input type="text" id="stock-update" class="form-control">
                                             </div>
                                        </div>
                                   </div>
                                   <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                             data-bs-dismiss="modal">Close</button>
                                        <button type="button" id="updateButton" class="btn btn-primary"
                                             onclick="updateProduct()">Update Product</button>
                                   </div>
                              </div>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <!-- ==================================================== -->
     <!-- End Page Content -->
     <!-- ==================================================== -->

     </div>

     <!-- END Wrapper -->

     <!-- Vendor Javascript (Require in all Page) -->
     <script src="assets/js/vendor.js"></script>

     <!-- App Javascript (Require in all Page) -->
     <script src="assets/js/app.js"></script>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
     <script src="assets/js/indent.js"></script>
     <script src="assets/js/http-util.js"> </script>
     <script src="assets/js/storage-util.js"></script>
     <script src="assets/js/table-gridjs.js"></script>
     <script src="assets/js/gridjs.umd.js"></script>
    <script src="assets/js/customFunctions.js"></script>
     <script>
          restrictMenu();
     </script>
</body>

</html>
