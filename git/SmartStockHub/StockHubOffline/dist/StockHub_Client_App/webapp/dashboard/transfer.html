<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Transfer Stock</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Transfer stock between items" />
     <meta name="author" content="Techzaa" />
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />

     <!-- App favicon -->
     <link rel="shortcut icon" href="assets/images/favicon.ico">

     <!-- Vendor css (Require in all Page) -->
     <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />

     <!-- Icons css (Require in all Page) -->
     <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

     <!-- App css (Require in all Page) -->
     <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />

     <!-- Theme Config js (Require in all Page) -->
     <script src="assets/js/config.js"></script>
</head>

<body>

     <!-- START Wrapper -->
     <div class="wrapper">

          <!-- ========== Topbar Start ========== -->
          <header class="topbar">
               <div class="container-fluid">
                    <div class="navbar-header">
                         <div class="d-flex align-items-center">
                              <!-- Menu Toggle Button -->
                              <div class="topbar-item">
                                   <button type="button" class="button-toggle-menu me-2">
                                        <iconify-icon icon="solar:hamburger-menu-broken"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>

                              <!-- Menu Toggle Button -->
                              <div class="topbar-item">
                                   <h4 class="fw-bold topbar-button pe-none text-uppercase mb-0">Welcome to&nbsp;<span
                                             id="shopName"></span>&nbsp;!</h4>
                              </div>
                         </div>

                         <div class="d-flex align-items-center gap-1">

                              <!-- Theme Color (Light/Dark) -->
                              <div class="topbar-item">
                                   <button type="button" class="topbar-button" id="light-dark-mode">
                                        <iconify-icon icon="solar:moon-bold-duotone"
                                             class="fs-24 align-middle"></iconify-icon>
                                   </button>
                              </div>
                         </div>
                    </div>
               </div>
          </header>
          <!-- ========== Topbar End ========== -->

          <!-- ========== App Menu Start ========== -->
          <div class="main-nav">
               <!-- Sidebar Logo -->
               <div class="logo-box">
                    <a href="index.html" class="logo-dark">
                         <span class="menu-title" style="color:black;font-size:large;">IMS</span>
                    </a>

                    <a href="index.html" class="logo-light">
                         <span class="menu-title" style="color:white;font-size:large;">IMS</span>
                    </a>
               </div>

               <!-- Menu Toggle Button (sm-hover) -->
               <button type="button" class="button-sm-hover" aria-label="Show Full Sidebar">
                    <iconify-icon icon="solar:double-alt-arrow-right-bold-duotone"
                         class="button-sm-hover-icon"></iconify-icon>
               </button>

               <div class="scrollbar" data-simplebar>
                    <ul class="navbar-nav menu-container" id="navbar-nav">
                    </ul>
               </div>
          </div>
          <!-- ========== App Menu End ========== -->

          <!-- ==================================================== -->
          <!-- Start right Content here -->
          <!-- ==================================================== -->
          <div class="page-content">

               <!-- Start Container Fluid -->
               <div class="container-fluid">
                    <div id="transfer-alert-container"></div>
                    <div class="row">
                         <div class="col-xl-12">
                              <div class="card">
                                   <div class="card-header">
                                        <h4 class="card-title">Stock Transfer</h4>
                                   </div>
                                   <div class="card-body">
                                        <form id="transferForm" class="row align-items-end g-3">
                                             <div class="col-md-4 position-relative">
                                                  <label for="fromItem" class="form-label">From Item</label>
                                                  <input type="text" class="form-control" id="fromItem"
                                                       placeholder="Type to search..." autocomplete="off">
                                                  <ul class="dropdown-menu w-100" id="fromItemDropdown"
                                                       style="max-height: 200px; overflow-y: auto;"></ul>
                                             </div>

                                             <div class="col-md-1">
                                                  <label class="form-label">Avail Qty</label>
                                                  <h4 class="m-0" id="availableQty">0</h4>
                                             </div>

                                             <div class="col-md-4 position-relative">
                                                  <label for="toItem" class="form-label">To Item</label>
                                                  <input type="text" class="form-control" id="toItem"
                                                       placeholder="Type to search..." autocomplete="off">
                                                  <ul class="dropdown-menu w-100" id="toItemDropdown"
                                                       style="max-height: 200px; overflow-y: auto;"></ul>
                                             </div>

                                             <div class="col-md-2">
                                                  <label for="toItemAvailableQty" class="form-label">Inbound Qty</label>
                                                  <input type="number" class="form-control" id="toItemAvailableQty"
                                                       value="0">
                                             </div>

                                             <div class="col-md-1">
                                                  <button type="button" class="btn btn-primary w-100"
                                                       id="btnAdd">Add</button>
                                             </div>
                                        </form>

                                        <div class="table-responsive mt-4">
                                             <table class="table table-bordered table-striped align-middle"
                                                  id="transferTable">
                                                  <thead class="table-light">
                                                       <tr>
                                                            <th>From Item</th>
                                                            <th>Actual Stock</th>
                                                            <th>Transferred Stock</th>
                                                            <th>Current Stock</th>
                                                            <th>To Item</th>
                                                            <th>Actual Stock</th>
                                                            <th>Received Stock</th>
                                                            <th>Current Stock</th>
                                                            <th>Action</th>
                                                       </tr>
                                                  </thead>
                                                  <tbody>
                                                       <!-- Rows will be added dynamically -->
                                                  </tbody>
                                             </table>
                                        </div>

                                        <div class="mt-3 text-end">
                                             <button type="button" class="btn btn-success" id="btnSaveTransfer">Save
                                                  Changes</button>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

               </div>
          </div>
     </div>

     <!-- Vendor Javascript (Require in all Page) -->
     <script src="assets/js/vendor.js"></script>

     <!-- App Javascript (Require in all Page) -->
     <script src="assets/js/app.js"></script>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <script src="assets/js/http-util.js"> </script>
     <script src="assets/js/storage-util.js"></script>
     <script src="assets/js/customFunctions.js"></script>
     <script src="assets/js/transfer.js"></script>

     <script>
          restrictMenu();
          updateShopName();
     </script>
</body>

</html>
