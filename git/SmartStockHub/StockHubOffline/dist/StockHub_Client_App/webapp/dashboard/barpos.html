     <script>
        $(document).ready(function () {
              let salesData = [];
              let itemIndex = 1;
              let totalAmount = 0;
              const productMaster = localStorage.getItem('products');  
              const products = productMaster ? JSON.parse(productMaster) : null;
              const items = products.productList;

              $(document).keypress(function (event) {
                  if (event.which === 13 && salesData.length > 0) {
                      let scannedCode = salesData.join('').trim();
                      salesData = [];
                      
                      let item = items.find(i => i.UPC === scannedCode);
                      if (item) {
                          let rowId = `row-${itemIndex}`;
                          let newRow = `<tr id="${rowId}"><td>${itemIndex++}</td><td>${item.SKU}</td><td class="sale-price">$${item.salePrice.toFixed(2)}</td><td class="quantity">1</td><td><button class="btn btn-danger btn-sm remove-item" data-id="${rowId}" data-sku="${item.SKU}" data-price="${item.salePrice}">Remove</button></td></tr>`;
                          $('#sales-table').append(newRow);
                          totalAmount += item.salePrice;
                          $('#total-amount').text(totalAmount.toFixed(2));
                      } else {
                          alert('Item not found!');
                      }
                  } else {
                      salesData.push(String.fromCharCode(event.which));
                  }
              });

              $(document).on('click', '.remove-item', function () {
                  let rowId = $(this).data('id');
                  let itemPrice = parseFloat($(this).data('price'));
                  $('#' + rowId).remove();
                  totalAmount -= itemPrice;
                  $('#total-amount').text(totalAmount.toFixed(2));
              });

              $(document).on('click', '.btn-success', function () {
                  let checkoutData = {};
                  
                  $('#sales-table tr').each(function () {
                      let sku = $(this).find('td:nth-child(2)').text();
                      let price = parseFloat($(this).find('.sale-price').text().replace('$', ''));
                      let quantity = parseInt($(this).find('.quantity').text());
                      
                      if (checkoutData[sku]) {
                          checkoutData[sku].quantity += quantity;
                          checkoutData[sku].totalPrice += price * quantity;
                      } else {
                          checkoutData[sku] = {
                              SKU: sku,
                              quantity: quantity,
                              totalPrice: price * quantity
                          };
                      }
                  });
                  
                  console.log(JSON.stringify(Object.values(checkoutData), null, 2));
                  alert('Checkout JSON constructed. Check console for details.');
              });
          });
    </script>
