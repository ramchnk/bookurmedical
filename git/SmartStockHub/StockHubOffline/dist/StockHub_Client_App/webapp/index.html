<!DOCTYPE html>
<html>

<head>
  <title>Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .signin-container {
      display: flex;
      min-height: 100vh;
    }

    .left-section {
      background-color: #fef3e4;
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .left-section .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      height: auto;
    }

    .left-section h2 {
      font-size: 36px;
      color: #d35400;
      margin-bottom: 10px;
      text-align: center;
    }

    .left-section p {
      font-size: 18px;
      color: #a5633c;
      text-align: center;
      margin-bottom: 20px;
    }

    .left-section .illustration {
      width: 350px;
      margin-top: 20px;
    }

    .right-section {
      background-color: #ffffff;
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .need-help {
      position: absolute;
      top: 20px;
      right: 40px;
      cursor: pointer;
      color: #e67e22;
      font-weight: bold;
    }

    .need-help:hover {
      text-decoration: underline;
    }

    .signin-box {
      width: 100%;
      max-width: 400px;
    }

    .signin-header h2 {
      text-align: center;
      font-size: 28px;
      color: #e67e22;
      margin-bottom: 30px;
    }

    .signin-form {
      width: 100%;
    }

    .signin-form .form-item {
      margin-bottom: 20px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #bfbfbf;
    }

    .input-with-icon input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border-radius: 5px;
      border: 1px solid #e0e0e0;
      font-size: 16px;
    }

    .input-with-icon input:hover,
    .input-with-icon input:focus {
      border-color: #e67e22;
      outline: none;
    }

    .signin-button {
      width: 100%;
      background-color: #e67e22;
      border: none;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
      border-radius: 5px;
    }

    .signin-button:hover {
      background-color: #d35400;
    }

    .signin-footer p {
      text-align: center;
      color: #7f8c8d;
      margin-top: 20px;
    }

    .signin-footer a {
      color: #e67e22;
      text-decoration: none;
      font-weight: bold;
    }

    .signin-footer a:hover {
      text-decoration: underline;
    }

    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #3498db;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="signin-container">
    <div class="left-section">
      <div class="content">
        <h2>Hi, Welcome back</h2>
        <p>Your gateway to Liquor success in Tamil Nadu</p>
        <img src="illustration.png" alt="Illustration" class="illustration" />
      </div>
    </div>
    <div class="right-section">
      <div class="need-help">Need help?</div>
      <div class="signin-box">
        <div class="signin-header">
          <h2>Sign in to your account</h2>
        </div>

        <div class="form-item">
          <div class="input-with-icon">
            <i class="fas fa-user"></i>
            <input type="email" name="email" placeholder="Email" id="email" required />
          </div>
        </div>
        <div class="form-item">
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" id="password" required />
          </div>
        </div>
        <div class="form-item">
          <button type="submit" onclick="logIn()" id="signin-btn" class="signin-button">
            <span id="signin-text">Sign In</span>
            <span id="signin-spinner" class="spinner" style="display:none;"></span>
          </button>

        </div>

        <div class="signin-footer">
          <p>
            Don't have an account? <a href="/signup">Call US</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="./dashboard/assets/js/jquery.min.js"></script>
<script src="./dashboard/assets/js/dexie.min.js"></script>
<script src="./dashboard/assets/js/db.js"></script>
<script src="./dashboard/assets/js/config.js"></script>
<script src="./dashboard/assets/js/storage-util.js"></script>
<script src="./dashboard/assets/js/http-util.js"></script>

<script src="./auth-service.js"></script>

</html>
